---
- name: Baseline
  ansible.builtin.import_playbook: baseline.yml


- name: Blog container
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Update apt cache and install packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - python3
          - python3-pip
          - 7zip
          - ffmpeg
        state: present